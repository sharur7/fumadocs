<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #111827; stroke: #374151; stroke-width: 1.5; rx: 8; }
      .box-auth { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; }
      .title { fill: #f9fafb; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .subtitle { fill: #9ca3af; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .step { fill: #c084fc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    </style>
  </defs>

  <!-- Client -->
  <g transform="translate(30, 45)">
    <rect width="160" height="130" class="box" />
    <text x="80" y="45" class="title">MCP Client</text>
    <text x="80" y="75" class="subtitle">PKCE Verifier</text>
    <text x="80" y="100" class="subtitle">Requests Token</text>
  </g>

  <!-- Identity Provider -->
  <g transform="translate(290, 40)">
    <rect width="180" height="140" class="box-auth" />
    <text x="90" y="35" class="title">OAuth 2.1 Provider</text>
    <text x="90" y="65" class="subtitle">Auth0 / Okta / Keycloak</text>
    <text x="90" y="90" class="subtitle">Issues JWT Access Token</text>
    <text x="90" y="115" class="subtitle">Exposes JWKS endpoint</text>
  </g>

  <!-- NitroStack Server -->
  <g transform="translate(565, 45)">
    <rect width="165" height="130" class="box" />
    <text x="82" y="35" class="title">NitroStack Guard</text>
    <text x="82" y="65" class="subtitle">Validates Bearer Token</text>
    <text x="82" y="90" class="subtitle">Caches JWKS Public Keys</text>
    <text x="82" y="110" class="subtitle">Checks Scope ACL</text>
  </g>
</svg>
