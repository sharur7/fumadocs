<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #111827; stroke: #374151; stroke-width: 1.5; rx: 8; }
      .box-core { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .title { fill: #f9fafb; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .subtitle { fill: #9ca3af; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .wire-text { fill: #38bdf8; font-family: ui-monospace, monospace; font-size: 11px; text-anchor: middle; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrow-cyan); marker-start: url(#arrow-cyan-start); }
    </style>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrow-cyan-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Client Side -->
  <g transform="translate(30, 40)">
    <rect width="180" height="150" class="box" />
    <text x="90" y="35" class="title">MCP Client</text>
    <text x="90" y="65" class="subtitle">Claude Desktop</text>
    <text x="90" y="90" class="subtitle">Cursor IDE</text>
    <text x="90" y="115" class="subtitle">ChatGPT / Web Agent</text>
  </g>

  <!-- Wire Protocol Connection -->
  <line x1="210" y1="115" x2="310" y2="115" class="arrow" />
  <text x="260" y="100" class="wire-text">JSON-RPC 2.0</text>
  <text x="260" y="135" class="subtitle">Stdio / HTTP</text>

  <!-- NitroStack Core -->
  <g transform="translate(310, 30)">
    <rect width="240" height="170" class="box-core" />
    <text x="120" y="30" class="title">NitroStack Core Engine</text>
    <text x="120" y="60" class="subtitle">• Request Pipeline &amp; Guards</text>
    <text x="120" y="85" class="subtitle">• Dependency Injection (DI)</text>
    <text x="120" y="110" class="subtitle">• Transport Multiplexer</text>
    <text x="120" y="135" class="subtitle">• Zod Schema Inferrer</text>
  </g>

  <line x1="550" y1="115" x2="610" y2="115" class="arrow" />

  <!-- Capabilities Exposed -->
  <g transform="translate(610, 40)">
    <rect width="160" height="150" class="box" />
    <text x="80" y="35" class="title">Capabilities</text>
    <text x="80" y="65" class="subtitle">@Tool (Actions)</text>
    <text x="80" y="90" class="subtitle">@Resource (Data)</text>
    <text x="80" y="115" class="subtitle">@Prompt (Templates)</text>
    <text x="80" y="135" class="subtitle">@Widget (React UI)</text>
  </g>
</svg>
