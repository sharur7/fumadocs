<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #111827; stroke: #374151; stroke-width: 1.5; rx: 8; }
      .box-stdio { fill: #1c1917; stroke: #f97316; stroke-width: 2; rx: 8; }
      .box-http { fill: #082f49; stroke: #0284c7; stroke-width: 2; rx: 8; }
      .title { fill: #f9fafb; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .subtitle { fill: #9ca3af; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Mode 1: Stdio -->
  <g transform="translate(40, 35)">
    <rect width="320" height="150" class="box-stdio" />
    <text x="160" y="35" class="title">Stdio Transport (Standard I/O)</text>
    <text x="160" y="65" class="subtitle">• Single-user desktop child process</text>
    <text x="160" y="90" class="subtitle">• Claude Desktop, local CLI tools</text>
    <text x="160" y="115" class="subtitle">• No network port listening required</text>
  </g>

  <!-- Mode 2: Streamable HTTP -->
  <g transform="translate(400, 35)">
    <rect width="320" height="150" class="box-http" />
    <text x="160" y="35" class="title">Streamable HTTP Transport</text>
    <text x="160" y="65" class="subtitle">• Multi-user network server (HTTP / SSE)</text>
    <text x="160" y="90" class="subtitle">• Cursor, ChatGPT, Docker, NitroCloud</text>
    <text x="160" y="115" class="subtitle">• Supports OAuth &amp; API Key headers</text>
  </g>
</svg>
